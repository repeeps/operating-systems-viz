<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0b0e14"/>
  <!-- user apps (top) -->
  <rect x="5" y="5" width="6" height="6" rx="1.5" fill="#37bdf8"/>
  <rect x="13" y="5" width="6" height="6" rx="1.5" fill="#34d399"/>
  <rect x="21" y="5" width="6" height="6" rx="1.5" fill="#f472b6"/>
  <!-- kernel layer (middle, the manager) -->
  <rect x="5" y="14" width="22" height="6" rx="2" fill="#c084fc"/>
  <!-- hardware (bottom): cpu + ram + disk -->
  <rect x="5" y="23" width="6" height="5" rx="1" fill="#94a3b8"/>
  <rect x="13" y="23" width="6" height="5" rx="1" fill="#94a3b8"/>
  <rect x="21" y="23" width="6" height="5" rx="1" fill="#94a3b8"/>
</svg>
